command:
  - npm
  - run
  - start
resources:
  - name: serving-endpoint
    serving_endpoint:
      name: haystack-agent-router
      permission: CAN_QUERY
env:
  - name: MODEL_SERVICE_PARENT
    value: "simo_prod.ai_models"
  - name: MODEL_SERVICE_PREFIX
    value: "route_"
  - name: UC_READ_ONLY_SOURCE
    value: "simo_prod.mysql_cdc_sync"
  - name: LAKEBASE_PROJECT
    value: "test_ontos"
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: serving-endpoint
