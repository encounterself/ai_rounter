bundle:
  name: haystack-control-plane

resources:
  apps:
    haystack_control_plane:
      name: haystack-control-plane
      source_code_path: .
      user_api_scopes:
        - serving.serving-endpoints
      config:
        command:
          - npm
          - run
          - start
        env:
          - name: MODEL_SERVICE_PARENT
            value: "simo_prod.ai_models"
          - name: MODEL_SERVICE_PREFIX
            value: "route_"
          - name: UC_READ_ONLY_SOURCE
            value: "simo_prod.mysql_cdc_sync"
          - name: LAKEBASE_PROJECT
            value: "test_ontos"
          - name: DATABRICKS_SERVING_ENDPOINT_NAME
            value_from: serving-endpoint
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: haystack-agent-router
            permission: CAN_QUERY
